format = 2

[effect]
id = "concat.tv-off"
name = "TV Off"
kind = "effect"
category = "Retro"
shelves = ["Distortion & Glitch"]
order = 20
description = "An old TV switching off: the picture collapses to a line, then a dot."

[[param]]
key = "speed"
label = "Speed"
min = 0
max = 100
default = 33
step = 1
unit = "%"

[[param]]
key = "chroma_x"
label = "Horizontal split"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "chroma_y"
label = "Vertical split"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
