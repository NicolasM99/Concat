format = 2

[effect]
id = "concat.vx1000"
name = "VX1000"
kind = "effect"
category = "Retro"
shelves = ["Distortion & Glitch"]
order = 36
intensity = "distortion"
description = "The skate-video look of a VX1000 with a fisheye: bent edges, fringes and crunchy contrast."

[[param]]
key = "distortion"
label = "Distortion"
min = 0
max = 100
default = 90
step = 1
unit = "%"

[[param]]
key = "chroma_x"
label = "Split"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
