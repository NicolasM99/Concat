format = 2

[effect]
id = "concat.shake"
name = "Shake"
kind = "effect"
category = "Camera"
order = 10
intensity = "strength"
description = "The picture shakes as if the camera were jolted."

[[param]]
key = "speed"
label = "Speed"
min = 0
max = 100
default = 33
step = 1
unit = "%"

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
