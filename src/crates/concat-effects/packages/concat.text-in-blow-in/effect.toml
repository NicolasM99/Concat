format = 2

[effect]
id = "concat.text-in-blow-in"
name = "Blow In"
kind = "animation"
category = "Text In"
order = 50
description = "The title blows in from close up, out of focus."

[animation]
slot = "in"
duration = 0.5
text = true
scale = "(3 + (1 - (3)) * (1 - pow(1 - t, 3)))"
opacity = "t"

[animation.effect]
id = "concat.gaussian-blur"
params = { radius = "1 + 25 * (1 - t)" }
