[effect]
id = "concat.fussy-male"
name = "Fussy male"
kind = "audio"
category = "Character"
order = 41
intensity = "pitch"
description = "A fussy, nasal low voice."

[[param]]
key = "pitch"
label = "Pitch"
min = -6
max = -1
default = -3
step = 0.5
unit = "st"

[ffmpeg]
let = [
  "ratio = pow(2, pitch / 12)",
]
chain = "aresample=48000,asetrate={fixed(48000 * ratio, 6)},aresample=48000,atempo={fixed(1 / ratio, 8)},equalizer=f=1200:t=q:w=1.5:g=5,highpass=f=150,alimiter=limit=0.94"
