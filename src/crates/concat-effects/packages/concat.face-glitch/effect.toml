format = 2

[effect]
id = "concat.face-glitch"
name = "Face Glitch"
kind = "effect"
category = "Body"
order = 43
intensity = "strength"
description = "The face glitches and splits while the rest stays still. Drawn about the point you place on the subject."

[[param]]
key = "centre"
label = "Subject"
type = "point"
default = 0.5

[[param]]
key = "size"
label = "Size"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
