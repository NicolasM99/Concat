format = 2

[effect]
id = "concat.mechanical"
name = "Mechanical"
kind = "effect"
category = "Body"
order = 82
intensity = "strength"
description = "Turning cogs and a metallic sheen give the subject a machine look. Drawn about the point you place on the subject."

[[param]]
key = "centre"
label = "Subject"
type = "point"
default = 0.5

[[param]]
key = "size"
label = "Size"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
