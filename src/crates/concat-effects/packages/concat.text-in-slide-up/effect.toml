format = 2

[effect]
id = "concat.text-in-slide-up"
name = "Slide Up"
kind = "animation"
category = "Text In"
order = 49
description = "The title slides up into place from a third further than its height, fading up."

[animation]
slot = "in"
duration = 0.5
text = true

[animation.glyphs]
block_dy = "1.33 * h * (1 - (1 - pow(1 - t, 2)))"
block_opacity = "(1 - pow(1 - t, 2))"
