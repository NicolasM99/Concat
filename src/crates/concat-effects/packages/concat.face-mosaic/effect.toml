format = 2

[effect]
id = "concat.face-mosaic"
name = "Face Mosaic"
kind = "effect"
category = "Body"
order = 42
description = "The face hidden behind mosaic blocks. Drawn about the point you place on the subject."

[[param]]
key = "centre"
label = "Subject"
type = "point"
default = 0.5

[[param]]
key = "size"
label = "Size"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "strength"
label = "Block size"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
