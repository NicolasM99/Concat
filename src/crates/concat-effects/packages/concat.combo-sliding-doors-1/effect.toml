format = 2

[effect]
id = "concat.combo-sliding-doors-1"
name = "Sliding Doors 1"
kind = "animation"
category = "Combo"
order = 93
description = "The clip slides in like a door and slides out the other way."

[animation]
slot = "combo"
duration = 2
x = "(-0.5 * (1 - (1 - pow(1 - clamp(t / 0.25, 0, 1), 3))) + 0.5 * pow(clamp((t - 0.75) / 0.25, 0, 1), 3))"
sx = "((1 - pow(1 - clamp(t / 0.25, 0, 1), 3)) * (1 - pow(clamp((t - 0.75) / 0.25, 0, 1), 3)))"
