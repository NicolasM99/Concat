format = 2

[effect]
id = "concat.pixel-blur"
name = "Pixel Blur"
kind = "effect"
category = "Blur"
order = 15
intensity = "noise"
description = "The picture breaks into soft, shifting pixels."

[[param]]
key = "speed"
label = "Speed"
min = 0
max = 100
default = 33
step = 1
unit = "%"

[[param]]
key = "noise"
label = "Size"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
