[effect]
id = "concat.big-house"
name = "Big House"
kind = "audio"
category = "Space"
order = 53
intensity = "size"
description = "The voice in a big, echoing house."

[[param]]
key = "size"
label = "Size"
min = 1
max = 10
default = 6
step = 0.5

[ffmpeg]
chain = "aecho=0.8:0.85:{round(40 + size * 12)}|{round(70 + size * 18)}:0.4|0.3,alimiter=limit=0.94"
