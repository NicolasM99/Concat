format = 2

[effect]
id = "concat.jitter"
name = "Jitter"
kind = "effect"
category = "Camera"
order = 14
intensity = "strength"
description = "The picture twitches by a few pixels, frame to frame."

[[param]]
key = "strength"
label = "Range"
min = 0
max = 100
default = 25
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
