# Colours in the working space: linear light, 1.0 the white of an SDR
# picture. Pinned from what the shader renders on a GPU.

[[probe]]
name = "default"
input = [0.3, 0.2, 0.12, 1]
expect = [0.54688, 0.25806, 0.12671, 1]

[[probe]]
name = "minimum"
at = "min"
input = [0.3, 0.2, 0.12, 1]
expect = [0.30005, 0.19995, 0.12, 1]

[[probe]]
name = "maximum"
at = "max"
input = [0.3, 0.2, 0.12, 1]
expect = [0.93213, 0.33398, 0.13452, 1]
