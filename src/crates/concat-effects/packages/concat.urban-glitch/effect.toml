format = 2

[effect]
id = "concat.urban-glitch"
name = "Urban Glitch"
kind = "transition"
category = "Glitch"
order = 31
description = "Blocks of both shots shift, invert and stutter like a broken street screen before the incoming one settles."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
fallback = "cross-fade"
