format = 2

[effect]
id = "concat.combo-enlarge-and-bounce"
name = "Enlarge and bounce"
kind = "animation"
category = "Combo"
order = 20
description = "The clip grows with a bounce and shrinks away."

[animation]
slot = "combo"
duration = 2
scale = "((1 + 2.70158 * pow(clamp(t / 0.25, 0, 1) - 1, 3) + 1.70158 * pow(clamp(t / 0.25, 0, 1) - 1, 2)) * (1 - pow(clamp((t - 0.75) / 0.25, 0, 1), 3)))"
