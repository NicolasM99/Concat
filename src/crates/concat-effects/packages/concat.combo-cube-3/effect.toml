format = 2

[effect]
id = "concat.combo-cube-3"
name = "Cube 3"
kind = "animation"
category = "Combo"
order = 48
description = "The clip turns in like a cube's face from the right."

[animation]
slot = "combo"
duration = 2
x = "(0.5 * (1 - (1 - pow(1 - clamp(t / 0.25, 0, 1), 3))) - 0.5 * pow(clamp((t - 0.75) / 0.25, 0, 1), 3))"
sx = "((1 - pow(1 - clamp(t / 0.25, 0, 1), 3)) * (1 - pow(clamp((t - 0.75) / 0.25, 0, 1), 3)))"
