format = 2

[effect]
id = "concat.combo-wave-and-slide"
name = "Wave and slide"
kind = "animation"
category = "Combo"
order = 16
description = "The clip waves in place, then slides away."

[animation]
slot = "combo"
duration = 2
x = "pow(clamp((t - 0.75) / 0.25, 0, 1), 3)"
rotation = "(8 * sin(t * pi * 6) * (1 - t))"
