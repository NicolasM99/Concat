format = 2

[effect]
id = "concat.stretch-ii"
name = "Stretch II"
kind = "transition"
category = "Distort"
order = 47
description = "The outgoing shot stretches tall and smears away; the incoming one arrives stretched and springs back to shape."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
xfade = "squeezev"
fallback = "cross-fade"
