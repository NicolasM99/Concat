format = 2

[effect]
id = "concat.combo-bisect-domino-2"
name = "Bisect Domino 2"
kind = "animation"
category = "Combo"
order = 58
description = "The clip topples in from the other side like a domino."

[animation]
slot = "combo"
duration = 2
y = "(0.3 * (1 - (1 - pow(1 - clamp(t / 0.25, 0, 1), 3))) + 0.3 * pow(clamp((t - 0.75) / 0.25, 0, 1), 3))"
rotation = "(90 * (1 - (1 - pow(1 - clamp(t / 0.25, 0, 1), 3))) - 90 * pow(clamp((t - 0.75) / 0.25, 0, 1), 3))"
