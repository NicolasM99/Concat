# Colours in the working space: linear light, 1.0 the white of an SDR
# picture. Pinned from what the shader renders on a GPU.

[[probe]]
name = "default"
input = [0.3, 0.2, 0.12, 1]
expect = [0.10077, 0.26855, 0.040314, 1]

[[probe]]
name = "minimum"
at = "min"
input = [0.3, 0.2, 0.12, 1]
expect = [0.10077, 0.067139, 0.16125, 1]

[[probe]]
name = "maximum"
at = "max"
input = [0.3, 0.2, 0.12, 1]
expect = [0.50391, 0.083923, 0.050385, 1]
