[effect]
id = "concat.trickster"
name = "Trickster"
kind = "audio"
category = "Character"
order = 45
intensity = "pitch"
description = "A sly, wavering high voice."

[[param]]
key = "pitch"
label = "Pitch"
min = 2
max = 8
default = 5
step = 0.5
unit = "st"

[ffmpeg]
let = [
  "ratio = pow(2, pitch / 12)",
]
chain = "aresample=48000,asetrate={fixed(48000 * ratio, 6)},aresample=48000,atempo={fixed(1 / ratio, 8)},vibrato=f=6:d=0.25,alimiter=limit=0.94"
