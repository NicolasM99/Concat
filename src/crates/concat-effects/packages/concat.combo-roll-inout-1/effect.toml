format = 2

[effect]
id = "concat.combo-roll-inout-1"
name = "Roll InOut 1"
kind = "animation"
category = "Combo"
order = 40
description = "The clip rolls in from the left and out to the right."

[animation]
slot = "combo"
duration = 2
x = "(-(1 - (1 - pow(1 - clamp(t / 0.25, 0, 1), 3))) + pow(clamp((t - 0.75) / 0.25, 0, 1), 3))"
rotation = "(-360 * (1 - (1 - pow(1 - clamp(t / 0.25, 0, 1), 3))) + 360 * pow(clamp((t - 0.75) / 0.25, 0, 1), 3))"
