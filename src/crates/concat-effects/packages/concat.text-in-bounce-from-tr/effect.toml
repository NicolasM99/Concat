format = 2

[effect]
id = "concat.text-in-bounce-from-tr"
name = "Bounce from TR"
kind = "animation"
category = "Text In"
order = 52
description = "The title bounces in from the top right."

[animation]
slot = "in"
duration = 0.5
text = true
x = "(0.4 * (1 - (1 + 2.70158 * pow(t - 1, 3) + 1.70158 * pow(t - 1, 2))))"
y = "(-0.4 * (1 - (1 + 2.70158 * pow(t - 1, 3) + 1.70158 * pow(t - 1, 2))))"
