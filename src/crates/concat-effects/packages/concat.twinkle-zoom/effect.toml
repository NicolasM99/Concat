format = 2

[effect]
id = "concat.twinkle-zoom"
name = "Twinkle Zoom"
kind = "transition"
category = "Zoom"
order = 40
description = "The outgoing shot zooms in with a burst of twinkling stars and the incoming one zooms back out of it."

[[param]]
key = "sparkle"
label = "Sparkle"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
fallback = "cross-fade"
