format = 2

[effect]
id = "concat.combo-fall-spin"
name = "Fall Spin"
kind = "animation"
category = "Combo"
order = 32
description = "The clip falls in spinning and falls out again."

[animation]
slot = "combo"
duration = 2
y = "(-(1 - (1 - pow(1 - clamp(t / 0.25, 0, 1), 3))) + pow(clamp((t - 0.75) / 0.25, 0, 1), 3))"
rotation = "(-180 * (1 - (1 - pow(1 - clamp(t / 0.25, 0, 1), 3))) + 180 * pow(clamp((t - 0.75) / 0.25, 0, 1), 3))"
