format = 2

[effect]
id = "concat.combo-cube-2-1"
name = "Cube 2 II"
kind = "animation"
category = "Combo"
order = 49
description = "The clip turns in like a cube's face from below."

[animation]
slot = "combo"
duration = 2
y = "(0.5 * (1 - (1 - pow(1 - clamp(t / 0.25, 0, 1), 3))) - 0.5 * pow(clamp((t - 0.75) / 0.25, 0, 1), 3))"
sy = "((1 - pow(1 - clamp(t / 0.25, 0, 1), 3)) * (1 - pow(clamp((t - 0.75) / 0.25, 0, 1), 3)))"
