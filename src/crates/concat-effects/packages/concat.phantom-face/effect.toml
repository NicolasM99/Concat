format = 2

[effect]
id = "concat.phantom-face"
name = "Phantom Face"
kind = "effect"
category = "Body"
order = 44
intensity = "strength"
description = "A ghostly double of the face floats off and fades. Drawn about the point you place on the subject."

[[param]]
key = "centre"
label = "Subject"
type = "point"
default = 0.5

[[param]]
key = "size"
label = "Size"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
