# Colours in the working space: linear light, 1.0 the white of an SDR
# picture. Pinned from what the shader renders on a GPU.

[[probe]]
name = "default"
input = [0.3, 0.2, 0.12, 1]
expect = [0.81982, 0.77734, 0.69531, 1]

[[probe]]
name = "minimum"
at = "min"
input = [0.3, 0.2, 0.12, 1]
expect = [0.94971, 0.92969, 0.84961, 1]

[[probe]]
name = "maximum"
at = "max"
input = [0.3, 0.2, 0.12, 1]
expect = [0.68994, 0.62451, 0.54053, 1]
