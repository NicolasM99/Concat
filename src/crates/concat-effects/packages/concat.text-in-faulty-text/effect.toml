format = 2

[effect]
id = "concat.text-in-faulty-text"
name = "Faulty text"
kind = "animation"
category = "Text In"
order = 10
description = "The title stutters on like a faulty sign."

[animation]
slot = "in"
duration = 0.5
text = true
opacity = "(if(t < 0.2, 0.3, if(t < 0.35, 1, if(t < 0.5, 0.2, if(t < 0.65, 1, if(t < 0.75, 0.4, 1))))))"
