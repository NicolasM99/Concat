format = 2

[effect]
id = "concat.open-horizontally"
name = "Open Horizontally"
kind = "transition"
category = "Slide"
order = 42
description = "The outgoing shot splits down the middle and its halves slide apart to either side."

[[param]]
key = "gap"
label = "Depth"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
xfade = "horzopen"
fallback = "cross-fade"
