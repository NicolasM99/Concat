format = 2

[effect]
id = "concat.combo-flip-6"
name = "Flip 6"
kind = "animation"
category = "Combo"
order = 84
description = "The clip flips top over bottom in at the start and out at the end."

[animation]
slot = "combo"
duration = 2
sy = "((1 - pow(1 - clamp(t / 0.25, 0, 1), 3)) * (1 - pow(clamp((t - 0.75) / 0.25, 0, 1), 3)))"
