format = 2

[effect]
id = "concat.butterfly-wings"
name = "Butterfly Wings"
kind = "effect"
category = "Body"
order = 62
intensity = "strength"
description = "Shimmering butterfly wings spread behind the subject. Drawn about the point you place on the subject."

[[param]]
key = "centre"
label = "Subject"
type = "point"
default = 0.5

[[param]]
key = "size"
label = "Size"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
