format = 2

[effect]
id = "concat.mini-zoom"
name = "Mini Zoom"
kind = "effect"
category = "Camera"
order = 16
intensity = "range"
description = "A slow, steady push in from the start of the clip."

[[param]]
key = "speed"
label = "Speed"
min = 0
max = 100
default = 33
step = 1
unit = "%"

[[param]]
key = "range"
label = "Range"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
