format = 2

[effect]
id = "concat.combo-slide-and-wave"
name = "Slide and wave"
kind = "animation"
category = "Combo"
order = 15
description = "The clip slides in and waves as it goes."

[animation]
slot = "combo"
duration = 2
x = "(-(1 - (1 - pow(1 - clamp(t / 0.25, 0, 1), 3))) + pow(clamp((t - 0.75) / 0.25, 0, 1), 3))"
rotation = "(8 * sin(t * pi * 6))"
