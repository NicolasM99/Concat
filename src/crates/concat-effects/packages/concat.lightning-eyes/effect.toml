format = 2

[effect]
id = "concat.lightning-eyes"
name = "Lightning Eyes"
kind = "effect"
category = "Body"
order = 51
intensity = "strength"
description = "Bolts of lightning crackle from the eyes. Drawn about the point you place on the subject."

[[param]]
key = "centre"
label = "Subject"
type = "point"
default = 0.5

[[param]]
key = "size"
label = "Size"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
