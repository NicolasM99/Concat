[effect]
id = "concat.low-battery"
name = "Low Battery"
kind = "audio"
category = "Voice"
order = 55
intensity = "drain"
description = "A voice running down like a toy with a flat battery, sagging and wobbling."

[[param]]
key = "drain"
label = "Drain"
min = 1
max = 10
default = 5
step = 0.5

[ffmpeg]
chain = "vibrato=f={fixed(0.5 + drain * 0.15, 2)}:d={fixed(0.2 + drain * 0.06, 2)},lowpass=f={round(5000 - drain * 300)},alimiter=limit=0.94"
