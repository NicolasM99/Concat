format = 2

[effect]
id = "concat.in-my-heart"
name = "In My Heart"
kind = "effect"
category = "Love"
order = 54
intensity = "strength"
description = "The subject framed inside a big pink heart, the rest softened. Drawn about the point you place on the subject."

[[param]]
key = "centre"
label = "Subject"
type = "point"
default = 0.5

[[param]]
key = "size"
label = "Size"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
