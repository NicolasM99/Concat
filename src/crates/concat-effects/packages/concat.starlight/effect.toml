format = 2

[effect]
id = "concat.starlight"
name = "Starlight"
kind = "effect"
category = "Sparkle"
order = 72
intensity = "strength"
description = "Stars twinkle into a glow around the subject. Drawn about the point you place on the subject."

[[param]]
key = "centre"
label = "Subject"
type = "point"
default = 0.5

[[param]]
key = "size"
label = "Size"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
