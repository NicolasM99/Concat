[effect]
id = "concat.jessie"
name = "Jessie"
kind = "audio"
category = "Character"
order = 49
intensity = "pitch"
description = "A slightly higher, bright voice."

[[param]]
key = "pitch"
label = "Pitch"
min = 1
max = 4
default = 2
step = 0.5
unit = "st"

[ffmpeg]
let = [
  "ratio = pow(2, pitch / 12)",
]
chain = "aresample=48000,asetrate={fixed(48000 * ratio, 6)},aresample=48000,atempo={fixed(1 / ratio, 8)},equalizer=f=2500:t=q:w=1:g=2,alimiter=limit=0.94"
