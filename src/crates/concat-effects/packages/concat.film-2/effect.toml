format = 2

[effect]
id = "concat.film-2"
name = "Film 2"
kind = "effect"
category = "Retro"
shelves = ["Distortion & Glitch"]
order = 32
description = "A film print with misregistered colours and gentle grain."

[[param]]
key = "chroma_x"
label = "Horizontal split"
min = 0
max = 100
default = 55
step = 1
unit = "%"

[[param]]
key = "chroma_y"
label = "Vertical split"
min = 0
max = 100
default = 55
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
