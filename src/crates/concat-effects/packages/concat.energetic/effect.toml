[effect]
id = "concat.energetic"
name = "Energetic"
kind = "audio"
category = "Voice"
order = 54
intensity = "drive"
description = "A punchy, bright, upfront voice."

[[param]]
key = "drive"
label = "Drive"
min = 1
max = 10
default = 5
step = 0.5

[ffmpeg]
chain = "equalizer=f=3000:t=q:w=1:g={fixed(drive * 0.8, 1)},acompressor=threshold=0.1:ratio={fixed(2 + drive * 0.4, 1)}:attack=5:release=60,alimiter=limit=0.94"
