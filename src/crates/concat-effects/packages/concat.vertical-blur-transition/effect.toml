format = 2

[effect]
id = "concat.vertical-blur-transition"
name = "Vertical Blur"
kind = "transition"
category = "Blur"
order = 31
description = "The cut smears both shots up and down and they resolve on the incoming one."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
xfade = "fade"
fallback = "cross-fade"
