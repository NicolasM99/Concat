format = 2

[effect]
id = "concat.text-in-concentrate"
name = "Concentrate"
kind = "animation"
category = "Text In"
order = 3
description = "The title comes into focus as it shrinks into place."

[animation]
slot = "in"
duration = 0.5
text = true
scale = "(1.8 + (1 - (1.8)) * (1 - pow(1 - t, 3)))"
opacity = "t"

[animation.effect]
id = "concat.gaussian-blur"
params = { radius = "1 + 20 * (1 - t)" }
