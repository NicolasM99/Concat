format = 2

[effect]
id = "concat.dizzy"
name = "Dizzy"
kind = "effect"
category = "Camera"
order = 24
intensity = "size"
description = "The picture reels and doubles, as if the room were spinning."

[[param]]
key = "speed"
label = "Speed"
min = 0
max = 100
default = 33
step = 1
unit = "%"

[[param]]
key = "size"
label = "Size"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
