format = 2

[effect]
id = "concat.combo-fan-out"
name = "Fan Out"
kind = "animation"
category = "Combo"
order = 86
description = "The clip fans open from a corner and closes again."

[animation]
slot = "combo"
duration = 2
x = "(-0.3 * (1 - (1 - pow(1 - clamp(t / 0.25, 0, 1), 3))) - 0.3 * pow(clamp((t - 0.75) / 0.25, 0, 1), 3))"
y = "(0.3 * (1 - (1 - pow(1 - clamp(t / 0.25, 0, 1), 3))) + 0.3 * pow(clamp((t - 0.75) / 0.25, 0, 1), 3))"
rotation = "(-60 * (1 - (1 - pow(1 - clamp(t / 0.25, 0, 1), 3))) + 60 * pow(clamp((t - 0.75) / 0.25, 0, 1), 3))"
