format = 2

[effect]
id = "concat.text-in-school-trip"
name = "School Trip"
kind = "animation"
category = "Text In"
order = 37
description = "The letters pop in one after another, each widening from a sliver."

[animation]
slot = "in"
duration = 0.5
text = true

[animation.glyphs]
sx = "(1 - pow(1 - window(t, 0.05 + 0.75 * i / max(n - 1, 1), 0.05 + 0.75 * i / max(n - 1, 1) + 0.13), 3))"
opacity = "min(1, 3 * window(t, 0.05 + 0.75 * i / max(n - 1, 1), 0.05 + 0.75 * i / max(n - 1, 1) + 0.13))"
