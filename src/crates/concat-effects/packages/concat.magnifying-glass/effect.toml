format = 2

[effect]
id = "concat.magnifying-glass"
name = "Magnifying Glass"
kind = "effect"
category = "Distort"
order = 34
intensity = "strength"
description = "A round magnifying glass enlarges one part of the picture."

[[param]]
key = "centre"
label = "Position"
type = "point"
default = 0.5

[[param]]
key = "size"
label = "Size"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "strength"
label = "Zoom"
min = 0
max = 100
default = 100
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
