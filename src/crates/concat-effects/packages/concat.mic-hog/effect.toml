[effect]
id = "concat.mic-hog"
name = "Mic Hog"
kind = "audio"
category = "Voice"
order = 58
intensity = "drive"
description = "Someone hogging the mic: too close, loud and clipping."

[[param]]
key = "drive"
label = "Drive"
min = 1
max = 10
default = 5
step = 0.5

[ffmpeg]
chain = "equalizer=f=200:t=q:w=1:g={fixed(drive * 0.6, 1)},acompressor=threshold=0.05:ratio=8:attack=2:release=40,volume={fixed(1 + drive * 0.15, 2)},alimiter=limit=0.94"
