format = 2

[effect]
id = "concat.fluoro-flash"
name = "Fluoro Flash"
kind = "effect"
category = "Body"
order = 16
intensity = "strength"
description = "Outlines flash fluorescent on the beat. Drawn around the edges in the picture; place it on a clip with a clear subject."

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
