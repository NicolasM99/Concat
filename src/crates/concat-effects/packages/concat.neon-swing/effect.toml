format = 2

[effect]
id = "concat.neon-swing"
name = "Neon Swing"
kind = "effect"
category = "Camera"
order = 23
intensity = "luminance"
description = "The picture swings while its edges glow neon."

[[param]]
key = "speed"
label = "Speed"
min = 0
max = 100
default = 33
step = 1
unit = "%"

[[param]]
key = "luminance"
label = "Glow"
min = 0
max = 100
default = 100
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
