format = 2

[effect]
id = "concat.combo-zoom-2"
name = "Zoom 2"
kind = "animation"
category = "Combo"
order = 2
description = "The clip arrives large, settles, then swells away."

[animation]
slot = "combo"
duration = 2
scale = "(1.6 - 0.6 * (1 - pow(1 - clamp(t / 0.25, 0, 1), 3)) + 0.6 * pow(clamp((t - 0.75) / 0.25, 0, 1), 3))"
opacity = "(min(1, clamp(t / 0.25, 0, 1) * 2) * (1 - clamp((t - 0.75) / 0.25, 0, 1)))"
