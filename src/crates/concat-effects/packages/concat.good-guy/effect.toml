[effect]
id = "concat.good-guy"
name = "Good Guy"
kind = "audio"
category = "Character"
order = 50
intensity = "pitch"
description = "A slightly deeper, warm voice."

[[param]]
key = "pitch"
label = "Pitch"
min = -4
max = -1
default = -2
step = 0.5
unit = "st"

[ffmpeg]
let = [
  "ratio = pow(2, pitch / 12)",
]
chain = "aresample=48000,asetrate={fixed(48000 * ratio, 6)},aresample=48000,atempo={fixed(1 / ratio, 8)},equalizer=f=200:t=q:w=1:g=3,alimiter=limit=0.94"
