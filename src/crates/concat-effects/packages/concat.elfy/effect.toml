[effect]
id = "concat.elfy"
name = "Elfy"
kind = "audio"
category = "Character"
order = 47
intensity = "pitch"
description = "A light, slightly higher voice."

[[param]]
key = "pitch"
label = "Pitch"
min = 2
max = 6
default = 4
step = 0.5
unit = "st"

[ffmpeg]
let = [
  "ratio = pow(2, pitch / 12)",
]
chain = "aresample=48000,asetrate={fixed(48000 * ratio, 6)},aresample=48000,atempo={fixed(1 / ratio, 8)},equalizer=f=4000:t=q:w=1:g=2,alimiter=limit=0.94"
