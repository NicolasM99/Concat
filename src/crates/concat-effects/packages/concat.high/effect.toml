[effect]
id = "concat.high"
name = "High"
kind = "audio"
category = "Voice"
order = 52
intensity = "pitch"
description = "The voice pitched up and brightened."

[[param]]
key = "pitch"
label = "Pitch"
min = 2
max = 8
default = 4
step = 0.5
unit = "st"

[ffmpeg]
let = [
  "ratio = pow(2, pitch / 12)",
]
chain = "aresample=48000,asetrate={fixed(48000 * ratio, 6)},aresample=48000,atempo={fixed(1 / ratio, 8)},highpass=f=180,alimiter=limit=0.94"
