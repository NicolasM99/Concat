[effect]
id = "concat.low"
name = "Low"
kind = "audio"
category = "Voice"
order = 51
intensity = "pitch"
description = "The voice pitched down and darkened."

[[param]]
key = "pitch"
label = "Pitch"
min = -8
max = -2
default = -5
step = 0.5
unit = "st"

[ffmpeg]
let = [
  "ratio = pow(2, pitch / 12)",
]
chain = "aresample=48000,asetrate={fixed(48000 * ratio, 6)},aresample=48000,atempo={fixed(1 / ratio, 8)},lowpass=f=3500,alimiter=limit=0.94"
