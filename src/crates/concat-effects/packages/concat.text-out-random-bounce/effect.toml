format = 2

[effect]
id = "concat.text-out-random-bounce"
name = "Random Bounce"
kind = "animation"
category = "Text Out"
order = 64
description = "The title bounces about as it disappears."

[animation]
slot = "out"
duration = 0.5
text = true
x = "(0.04 * sin((1 - t) * 33) * (1 - (1 - t)))"
y = "(0.06 * sin((1 - t) * 27) * (1 - (1 - t)))"
opacity = "min(1, (1 - t) * 3)"
