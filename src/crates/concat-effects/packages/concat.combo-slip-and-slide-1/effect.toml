format = 2

[effect]
id = "concat.combo-slip-and-slide-1"
name = "Slip and slide 1"
kind = "animation"
category = "Combo"
order = 38
description = "The clip slips in sideways, overshooting, and slides out."

[animation]
slot = "combo"
duration = 2
x = "((1 - (1 + 2.70158 * pow(clamp(t / 0.25, 0, 1) - 1, 3) + 1.70158 * pow(clamp(t / 0.25, 0, 1) - 1, 2))) + pow(clamp((t - 0.75) / 0.25, 0, 1), 3))"
