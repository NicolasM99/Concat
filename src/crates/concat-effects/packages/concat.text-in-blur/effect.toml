format = 2

[effect]
id = "concat.text-in-blur"
name = "Blur"
kind = "animation"
category = "Text In"
order = 17
description = "The title sharpens out of a blur."

[animation]
slot = "in"
duration = 0.5
text = true
opacity = "min(1, t * 2)"

[animation.effect]
id = "concat.gaussian-blur"
params = { radius = "1 + 30 * (1 - t)" }
