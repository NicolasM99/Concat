format = 2

[effect]
id = "concat.in-swing-top-left"
name = "Swing Top Left"
kind = "animation"
category = "In"
order = 22
description = "The clip swings into place about its top left corner."

[animation]
slot = "in"
duration = 0.5
x = "(-0.5 + 0.5 * cos(((60 * (1 - (1 - pow(1 - t, 3)))) * pi / 180)) - 0.5 * sin(((60 * (1 - (1 - pow(1 - t, 3)))) * pi / 180)) - (-0.5 + 0.5))"
y = "(-0.5 + 0.5 * sin(((60 * (1 - (1 - pow(1 - t, 3)))) * pi / 180)) + 0.5 * cos(((60 * (1 - (1 - pow(1 - t, 3)))) * pi / 180)) - (-0.5 + 0.5))"
rotation = "60 * (1 - (1 - pow(1 - t, 3)))"
opacity = "min(1, t * 3)"
