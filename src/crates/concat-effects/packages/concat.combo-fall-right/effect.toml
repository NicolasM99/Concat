format = 2

[effect]
id = "concat.combo-fall-right"
name = "Fall Right"
kind = "animation"
category = "Combo"
order = 35
description = "The clip falls in from the top left and out to the right."

[animation]
slot = "combo"
duration = 2
x = "(-(1 - (1 - pow(1 - clamp(t / 0.25, 0, 1), 3))) + pow(clamp((t - 0.75) / 0.25, 0, 1), 3))"
y = "(-(1 - (1 - pow(1 - clamp(t / 0.25, 0, 1), 3))) * 0.5 + pow(clamp((t - 0.75) / 0.25, 0, 1), 3) * 0.5)"
rotation = "(30 * pow(clamp((t - 0.75) / 0.25, 0, 1), 3))"
