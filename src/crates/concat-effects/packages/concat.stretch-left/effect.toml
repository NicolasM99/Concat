format = 2

[effect]
id = "concat.stretch-left"
name = "Stretch Left"
kind = "transition"
category = "Distort"
order = 49
description = "The outgoing shot is pulled out to the left; the incoming one is pulled in after it from the right."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
xfade = "slideleft"
fallback = "cross-fade"
