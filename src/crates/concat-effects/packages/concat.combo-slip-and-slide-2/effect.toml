format = 2

[effect]
id = "concat.combo-slip-and-slide-2"
name = "Slip and slide 2"
kind = "animation"
category = "Combo"
order = 39
description = "The clip slips up into place and slides down out."

[animation]
slot = "combo"
duration = 2
y = "((1 - (1 + 2.70158 * pow(clamp(t / 0.25, 0, 1) - 1, 3) + 1.70158 * pow(clamp(t / 0.25, 0, 1) - 1, 2))) + pow(clamp((t - 0.75) / 0.25, 0, 1), 3))"
