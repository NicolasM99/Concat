format = 2

[effect]
id = "concat.combo-spin-rise"
name = "Spin Rise"
kind = "animation"
category = "Combo"
order = 22
description = "The clip spins as it rises up and away."

[animation]
slot = "combo"
duration = 2
y = "(0.5 * (1 - (1 - pow(1 - clamp(t / 0.25, 0, 1), 3))) - 0.6 * pow(clamp((t - 0.75) / 0.25, 0, 1), 3))"
rotation = "(360 * t)"
