[effect]
id = "concat.bestie"
name = "Bestie"
kind = "audio"
category = "Character"
order = 42
intensity = "pitch"
description = "A bright, chirpy higher voice."

[[param]]
key = "pitch"
label = "Pitch"
min = 1
max = 6
default = 3
step = 0.5
unit = "st"

[ffmpeg]
let = [
  "ratio = pow(2, pitch / 12)",
]
chain = "aresample=48000,asetrate={fixed(48000 * ratio, 6)},aresample=48000,atempo={fixed(1 / ratio, 8)},equalizer=f=3500:t=q:w=1:g=3,alimiter=limit=0.94"
