format = 2

[effect]
id = "concat.text-caption-zoom-out"
name = "Caption Zoom Out"
kind = "animation"
category = "Text In"
order = 42
description = "Each word appears as it is spoken, shrinking into place about the caption's middle."

[animation]
slot = "in"
duration = 0.5
text = true

[animation.glyphs]
sx = "if(t * d < ws, 0, max(1.3 - 0.3 * bezier(min(18 * clamp((t * d - ws) / max(we - ws, 0.001), 0, 1) / 12, 1), 0.025, 0.132587546, 0.26, 1), 1))"
sy = "if(t * d < ws, 0, max(1.3 - 0.3 * bezier(min(18 * clamp((t * d - ws) / max(we - ws, 0.001), 0, 1) / 12, 1), 0.025, 0.132587546, 0.26, 1), 1))"
dx = "(max(1.3 - 0.3 * bezier(min(18 * clamp((t * d - ws) / max(we - ws, 0.001), 0, 1) / 12, 1), 0.025, 0.132587546, 0.26, 1), 1) - 1) * gx"
dy = "(max(1.3 - 0.3 * bezier(min(18 * clamp((t * d - ws) / max(we - ws, 0.001), 0, 1) / 12, 1), 0.025, 0.132587546, 0.26, 1), 1) - 1) * gy"
opacity = "min(0.7 + 0.3 * bezier(min(12 * clamp((t * d - ws) / max(we - ws, 0.001), 0, 1) / 4, 1), 0.166666667, 0.166666667, 0.26, 1), 1)"
