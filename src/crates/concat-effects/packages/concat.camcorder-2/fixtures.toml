# Colours in the working space: linear light, 1.0 the white of an SDR
# picture. Pinned from what the shader renders on a GPU.

[[probe]]
name = "default"
input = [0.3, 0.2, 0.12, 1]
expect = [0.35767, 0.19763, 0.091675, 1]

[[probe]]
name = "minimum"
at = "min"
input = [0.3, 0.2, 0.12, 1]
expect = [0.36084, 0.19995, 0.09314, 1]

[[probe]]
name = "maximum"
at = "max"
input = [0.3, 0.2, 0.12, 1]
expect = [0.35547, 0.19604, 0.090759, 1]
