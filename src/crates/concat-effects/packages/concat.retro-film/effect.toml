format = 2

[effect]
id = "concat.retro-film"
name = "Retro Film"
kind = "effect"
category = "Retro"
order = 24
intensity = "strength"
description = "Old film stock: faded colour, flicker, dust and scratches."

[[param]]
key = "speed"
label = "Speed"
min = 0
max = 100
default = 30
step = 1
unit = "%"

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
