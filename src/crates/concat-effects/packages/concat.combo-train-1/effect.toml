format = 2

[effect]
id = "concat.combo-train-1"
name = "Train 1"
kind = "animation"
category = "Combo"
order = 200
description = "The clip runs in from the left and out to the right like a train."

[animation]
slot = "combo"
duration = 2
x = "(-1 * (1 - (1 - pow(1 - clamp(t / 0.25, 0, 1), 3))) - (-1) * pow(clamp((t - 0.75) / 0.25, 0, 1), 3))"
