format = 2

[effect]
id = "concat.text-in-bounce-in"
name = "Bounce In"
kind = "animation"
category = "Text In"
order = 48
description = "The title springs up from nothing past its size and settles."

[animation]
slot = "in"
duration = 0.5
text = true

[animation.glyphs]
block_scale = "if(t <= 0.57, 1.1 * bezier((t / 0.57), 0, 0, 0.51, 1), 1.1 + (1 - 1.1) * bezier(((t - 0.57) / 0.43), 0.2, 0, 0.13, 1))"
