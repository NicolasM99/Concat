format = 2

[effect]
id = "concat.swing"
name = "Swing"
kind = "effect"
category = "Camera"
order = 22
intensity = "size"
description = "The picture swings gently from side to side like a pendulum."

[[param]]
key = "speed"
label = "Speed"
min = 0
max = 100
default = 33
step = 1
unit = "%"

[[param]]
key = "size"
label = "Size"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
