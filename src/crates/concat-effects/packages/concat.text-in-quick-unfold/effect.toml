format = 2

[effect]
id = "concat.text-in-quick-unfold"
name = "Quick Unfold"
kind = "animation"
category = "Text In"
order = 40
description = "The title unfolds left to right, the letters streaking into place."

[animation]
slot = "in"
duration = 0.5
text = true

[animation.glyphs]
sx = "(0.3 + 0.7 * (1 - pow(1 - window(t, 0.05 + 0.45 * i / max(n - 1, 1), 0.05 + 0.45 * i / max(n - 1, 1) + 0.15), 3)))"
dx = "(-0.3 * (1 - (1 - pow(1 - window(t, 0.05 + 0.45 * i / max(n - 1, 1), 0.05 + 0.45 * i / max(n - 1, 1) + 0.15), 3))))"
opacity = "min(1, 2 * window(t, 0.05 + 0.45 * i / max(n - 1, 1), 0.05 + 0.45 * i / max(n - 1, 1) + 0.15))"
blur = "(0.12 * (1 - window(t, 0.05 + 0.45 * i / max(n - 1, 1), 0.05 + 0.45 * i / max(n - 1, 1) + 0.15)))"
