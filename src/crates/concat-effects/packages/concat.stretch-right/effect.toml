format = 2

[effect]
id = "concat.stretch-right"
name = "Stretch Right"
kind = "transition"
category = "Distort"
order = 48
description = "The outgoing shot is pulled out to the right; the incoming one is pulled in after it from the left."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
xfade = "slideright"
fallback = "cross-fade"
