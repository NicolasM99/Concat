[effect]
id = "concat.elf"
name = "Elf"
kind = "audio"
category = "Character"
order = 46
intensity = "pitch"
description = "A high, airy voice that shimmers."

[[param]]
key = "pitch"
label = "Pitch"
min = 3
max = 9
default = 6
step = 0.5
unit = "st"

[ffmpeg]
let = [
  "ratio = pow(2, pitch / 12)",
]
chain = "aresample=48000,asetrate={fixed(48000 * ratio, 6)},aresample=48000,atempo={fixed(1 / ratio, 8)},chorus=0.6:0.8:40:0.4:0.3:2,alimiter=limit=0.94"
