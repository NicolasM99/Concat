[effect]
id = "concat.electronic"
name = "Electronic"
kind = "audio"
category = "Voice"
order = 57
intensity = "depth"
description = "A buzzing, electronic voice."

[[param]]
key = "depth"
label = "Depth"
min = 1
max = 10
default = 5
step = 0.5

[ffmpeg]
chain = "aphaser=type=t:speed={fixed(0.5 + depth * 0.3, 2)}:decay=0.7,acrusher=bits={round(16 - depth)}:mix=0.4,alimiter=limit=0.94"
