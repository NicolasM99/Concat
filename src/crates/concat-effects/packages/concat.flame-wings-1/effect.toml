label = "Size"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
