format = 2

[effect]
id = "concat.flame-wings-1"
name = "Flame Wings 1"
kind = "effect"
category = "Body"
order = 63
intensity = "strength"
description = "Wings of fire spread behind the subject. Drawn about the point you place on the subject."

[[param]]
key = "centre"
label = "Subject"
