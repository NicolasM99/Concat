format = 2

[effect]
id = "concat.combo-waltzer-4"
name = "Waltzer 4"
kind = "animation"
category = "Combo"
order = 75
description = "The clip whirls in a loop, tilting as it goes."

[animation]
slot = "combo"
duration = 2
x = "(0.15 * sin(t * pi * 4))"
y = "(0.1 * sin(t * pi * 2))"
rotation = "(20 * cos(t * pi * 4))"
