[effect]
id = "concat.synth"
name = "Synth"
kind = "audio"
category = "Voice"
order = 59
intensity = "depth"
description = "A synthesised voice, chorused and swept."

[[param]]
key = "depth"
label = "Depth"
min = 1
max = 10
default = 5
step = 0.5

[ffmpeg]
chain = "chorus=0.7:0.9:55|60:0.4|0.32:0.25|0.4:2|2.3,flanger=delay=3:depth={fixed(depth * 0.8, 1)}:speed=0.5,alimiter=limit=0.94"
