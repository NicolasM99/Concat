format = 2

[effect]
id = "concat.axis-rotation-fx"
name = "Axis Rotation"
kind = "effect"
category = "Body"
order = 88
intensity = "strength"
description = "The picture swings back and forth about its vertical axis, as if on a turntable. Drawn about the point you place on the subject."

[[param]]
key = "centre"
label = "Subject"
type = "point"
default = 0.5

[[param]]
key = "size"
label = "Size"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
