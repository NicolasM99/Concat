[effect]
id = "concat.squirrel"
name = "Squirrel"
kind = "audio"
category = "Character"
order = 44
intensity = "pitch"
description = "A tiny, very high, quick voice."

[[param]]
key = "pitch"
label = "Pitch"
min = 6
max = 12
default = 9
step = 0.5
unit = "st"

[ffmpeg]
let = [
  "ratio = pow(2, pitch / 12)",
]
chain = "aresample=48000,asetrate={fixed(48000 * ratio, 6)},aresample=48000,atempo={fixed(1 / ratio, 8)},highpass=f=200,alimiter=limit=0.94"
