format = 2

[effect]
id = "concat.revolving-flames"
name = "Revolving Flames"
kind = "effect"
category = "Body"
order = 59
intensity = "strength"
description = "Flames circle round the subject. Drawn about the point you place on the subject."

[[param]]
key = "centre"
label = "Subject"
type = "point"
default = 0.5

[[param]]
key = "size"
label = "Size"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "speed"
label = "Speed"
min = 0
max = 100
default = 33
step = 1
unit = "%"

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
